openapi: 3.1.0
info:
  title: CubeTimer Sync API
  version: 1.0.0
  description: Authenticated, offline-first synchronization for CubeTimer clients.
servers:
  - url: https://sync.example.com
paths:
  /health/live:
    get:
      operationId: live
      tags: [system]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: ready
      tags: [system]
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCredentials"
      responses:
        "202":
          description: Verification message queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/email/resend:
    post:
      operationId: resendVerification
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Request accepted whether or not the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCredentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshToken"
      responses:
        "200":
          description: Rotated session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshToken"
      responses:
        "204":
          description: Refresh token revoked
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Request accepted whether or not the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        "200":
          description: Password changed and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/federated/{provider}:
    post:
      operationId: federatedLogin
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederatedInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/link/{provider}:
    post:
      operationId: linkFederatedIdentity
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederatedInput"
      responses:
        "204":
          description: Identity linked
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [account]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      tags: [account]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted successfully
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/password:
    put:
      operationId: changePassword
      tags: [account]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/sync:
    post:
      operationId: synchronize
      tags: [sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Mutation outcomes and ordered remote changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/stats/overview:
    get:
      operationId: getAdminOverviewStats
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account and activity totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewStats"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/stats/requests:
    get:
      operationId: getAdminRequestStats
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/StatsInterval"
      responses:
        "200":
          description: Aggregated request counts and latency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequestStats"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/stats/request-types:
    get:
      operationId: getAdminRequestTypeStats
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/StatsInterval"
      responses:
        "200":
          description: Request counts grouped by request type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRequestTypeStats"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/stats/errors:
    get:
      operationId: getAdminErrorStats
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Cursor for pagination - returns errors before this timestamp
      responses:
        "200":
          description: List of recorded application errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorLogResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/snapshot:
    post:
      summary: Snapshot bootstrap sync
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        '200':
          description: Snapshot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
  /v1/stats:
    get:
      summary: Get user statistics
      security:
        - bearerAuth: []
      parameters:
        - name: event
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Statistics response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
  /v1/sessions:
    get:
      summary: List sessions paginated
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated sessions response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSessionsResponse"
  "/v1/sessions/{id}/solves":
    get:
      summary: List solves for session paginated
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated solves response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSolvesResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Provider:
      in: path
      name: provider
      required: true
      schema:
        type: string
        enum: [google, apple]
    StatsFrom:
      in: query
      name: from
      schema:
        type: string
        format: date-time
    StatsTo:
      in: query
      name: to
      schema:
        type: string
        format: date-time
    StatsInterval:
      in: query
      name: interval
      schema:
        type: string
        enum: [hour, day]
        default: hour
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          description: Required if the user already has a password set.
        new_password:
          type: string
          minLength: 8

    PasswordCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
    RefreshToken:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    User:
      type: object
      required: [id, email, email_verified, user_role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        user_role:
          type: string
          enum: [user, admin]
    AdminOverviewStats:
      type: object
      required:
        [
          total_users,
          verified_users,
          new_users_24h,
          new_users_7d,
          new_users_30d,
          active_users_24h,
          active_users_7d,
          active_users_30d,
          total_devices,
          total_sessions,
          total_solves,
        ]
      properties:
        total_users:
          type: integer
          format: int64
        verified_users:
          type: integer
          format: int64
        new_users_24h:
          type: integer
          format: int64
        new_users_7d:
          type: integer
          format: int64
        new_users_30d:
          type: integer
          format: int64
        active_users_24h:
          type: integer
          format: int64
        active_users_7d:
          type: integer
          format: int64
        active_users_30d:
          type: integer
          format: int64
        total_devices:
          type: integer
          format: int64
        total_sessions:
          type: integer
          format: int64
        total_solves:
          type: integer
          format: int64
    AdminRequestStats:
      type: object
      required: [from, to, interval, points]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [hour, day]
        points:
          type: array
          items:
            $ref: "#/components/schemas/AdminRequestStatsPoint"
    AdminRequestStatsPoint:
      type: object
      required:
        [
          bucket,
          request_count,
          status_2xx,
          status_3xx,
          status_4xx,
          status_5xx,
          average_duration_ms,
          max_duration_ms,
        ]
      properties:
        bucket:
          type: string
          format: date-time
        request_count:
          type: integer
          format: int64
        status_2xx:
          type: integer
          format: int64
        status_3xx:
          type: integer
          format: int64
        status_4xx:
          type: integer
          format: int64
        status_5xx:
          type: integer
          format: int64
        average_duration_ms:
          type: number
          format: double
        max_duration_ms:
          type: integer
          format: int64
    AdminRequestTypeStats:
      type: object
      required: [from, to, interval, types]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [hour, day]
        types:
          type: array
          items:
            $ref: "#/components/schemas/AdminRequestTypeCount"
    AdminRequestTypeCount:
      type: object
      required: [type, request_count]
      properties:
        type:
          type: string
          enum: [auth, account, sync, snapshot, sessions, stats, other]
        request_count:
          type: integer
          format: int64
    ErrorLog:
      type: object
      required: [id, created_at, method, route, status, code, message]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        user_id:
          type: string
          nullable: true
        method:
          type: string
        route:
          type: string
        status:
          type: integer
        code:
          type: string
        message:
          type: string
    ErrorLogResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorLog"
        next_cursor:
          type: string
          format: date-time
          nullable: true
    AuthSession:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/User"
    FederatedInput:
      type: object
      required: [client_id, nonce]
      anyOf:
        - required: [id_token]
        - required: [code, redirect_uri, code_verifier]
      properties:
        id_token:
          type: string
        code:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
        nonce:
          type: string
    Device:
      type: object
      required: [id, name, platform]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        platform:
          type: string
          maxLength: 40
    SessionInput:
      type: object
      required: [id, name, event, kind, started_at, archived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        event:
          $ref: "#/components/schemas/Event"
        kind:
          type: string
          enum: [manual, automatic]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        archived:
          type: boolean
    SolveInput:
      type: object
      required: [id, duration_ms, penalty, solved_at, scramble, event]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: [string, "null"]
          format: uuid
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400000
        penalty:
          type: string
          enum: [none, plus_two, dnf]
        solved_at:
          type: string
          format: date-time
        scramble:
          type: string
          maxLength: 4096
        event:
          $ref: "#/components/schemas/Event"
    Session:
      type: object
      required: [id, name, event, kind, started_at, archived, version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        event:
          $ref: "#/components/schemas/Event"
        kind:
          type: string
          enum: [manual, automatic]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        archived:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
    Solve:
      type: object
      required: [id, duration_ms, penalty, solved_at, scramble, event, version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: [string, "null"]
          format: uuid
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400000
        penalty:
          type: string
          enum: [none, plus_two, dnf]
        solved_at:
          type: string
          format: date-time
        scramble:
          type: string
          maxLength: 4096
        event:
          $ref: "#/components/schemas/Event"
        version:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
    Event:
      type: string
      enum: [2x2, 3x3, 4x4, 5x5, megaminx, pyraminx]
    Mutation:
      type: object
      required: [id, entity, entity_id, operation, base_version]
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
          enum: [session, solve]
        entity_id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [upsert, delete]
        base_version:
          type: integer
          format: int64
          minimum: 0
        data:
          oneOf:
            - $ref: "#/components/schemas/SessionInput"
            - $ref: "#/components/schemas/SolveInput"
    MutationOutcome:
      type: object
      required: [mutation_id, status]
      properties:
        mutation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, rejected, conflict]
        version:
          type: integer
          format: int64
        code:
          type: string
        message:
          type: string
        current:
          oneOf:
            - $ref: "#/components/schemas/Session"
            - $ref: "#/components/schemas/Solve"
            - $ref: "#/components/schemas/ConflictStub"
    Change:
      type: object
      required: [cursor, entity, entity_id, operation, version, data, changed_at]
      properties:
        cursor:
          type: integer
          format: int64
        entity:
          type: string
          enum: [session, solve]
        entity_id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [upsert, delete]
        version:
          type: integer
          format: int64
        data:
          oneOf:
            - $ref: "#/components/schemas/Session"
            - $ref: "#/components/schemas/Solve"
            - $ref: "#/components/schemas/DeleteStub"
        changed_at:
          type: string
          format: date-time
    SyncRequest:
      type: object
      required: [cursor, device, mutations]
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
        device:
          $ref: "#/components/schemas/Device"
        mutations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Mutation"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
    SyncResponse:
      type: object
      required: [outcomes, changes, next_cursor, has_more]
      properties:
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/MutationOutcome"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        next_cursor:
          type: integer
          format: int64
        has_more:
          type: boolean
    SnapshotRequest:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        cursor:
          type: integer
          format: int64
          description: Change-log watermark. 0 on the first page; echo the response cursor on subsequent pages.
        after_id:
          type: string
          format: uuid
          description: Keyset position for the current entity. Zero UUID for the first page of each entity.
        entity:
          type: string
          enum: [session, solve]
        page_size:
          type: integer
    SnapshotResponse:
      type: object
      required: [cursor, has_more]
      properties:
        sessions:
