name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cubetimer_test
          POSTGRES_USER: cubetimer
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubetimer -d cubetimer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cubetimer:test-password@127.0.0.1:5432/cubetimer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: PostgreSQL integration tests
        run: go test -race -tags=integration ./internal/integration
      - name: Verify generated code
        run: make generate && git diff --exit-code
      - name: Build container
        run: docker build -t cubing-sync-backend:test .
