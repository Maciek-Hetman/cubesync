name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/cubetimer
            IMAGE="${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}"
            if grep -q '^CUBESYNC_IMAGE=' .env; then
              sed -i "s|^CUBESYNC_IMAGE=.*|CUBESYNC_IMAGE=${IMAGE}|" .env
            else
              echo "CUBESYNC_IMAGE=${IMAGE}" >> .env
            fi
            if [ -x ./backup.sh ]; then
              ./backup.sh || true
            fi
            docker compose pull
            docker compose up -d --no-build
            docker compose ps
            curl -fsS "https://api.cubetimer.cc/health/ready"
