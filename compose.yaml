services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-api.example.com}
      WEB_DOMAIN: ${WEB_DOMAIN:-example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${WEB_ROOT:-/var/www/cubetimer}:/srv/web:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal_net:
        ipv4_address: 172.30.0.10

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cubetimer
      POSTGRES_USER: cubetimer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubetimer -d cubetimer"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal_net

  migrate:
    image: ${CUBESYNC_IMAGE:-cubing-sync-backend:local}
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://cubetimer:${POSTGRES_PASSWORD:-development-password}@postgres:5432/cubetimer?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal_net

  api:
    image: ${CUBESYNC_IMAGE:-cubing-sync-backend:local}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://cubetimer:${POSTGRES_PASSWORD:-development-password}@postgres:5432/cubetimer?sslmode=disable
      HTTP_ADDRESS: :43781
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      TRUSTED_PROXIES: 172.30.0.10/32
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-43781}:43781"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/cubing-sync", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal_net

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev-mail"]
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal_net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

